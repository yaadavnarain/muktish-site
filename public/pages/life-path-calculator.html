    function reduceToSingleOrMaster(num) {
      while (num > 9 && num !== 11 && num !== 22 && num !== 33) {
        num = String(num).split('').reduce((a, b) => a + parseInt(b), 0);
      }
      return num;
    }

    function isMasterNumber(num) {
      return num === 11 || num === 22 || num === 33;
    }

    function calculateReductionMethod(day, month, year) {
      const reducedDay = reduceToSingleOrMaster(day);
      const reducedMonth = reduceToSingleOrMaster(month);
      const reducedYear = reduceToSingleOrMaster(
        String(year).split('').reduce((a, b) => a + parseInt(b), 0)
      );
      const total = reducedDay + reducedMonth + reducedYear;
      return reduceToSingleOrMaster(total);
    }

    function calculateAdditionMethod(day, month, year) {
      const allDigits = `${day}${month}${year}`;
      const sum = allDigits.split('').reduce((a, b) => a + parseInt(b), 0);
      return reduceToSingleOrMaster(sum);
    }

    function calculateLifePath() {
      const birthdate = document.getElementById('birthdate').value;
      if (!birthdate) {
        alert('Please enter your date of birth.');
        return;
      }

      const date = new Date(birthdate);
      const day = date.getDate();
      const month = date.getMonth() + 1;
      const year = date.getFullYear();

      const reductionResult = calculateReductionMethod(day, month, year);
      const additionResult = calculateAdditionMethod(day, month, year);

      const reductionMeaning = meanings[reductionResult];
      const additionMeaning = meanings[additionResult];

      // Update Reduction Method
      document.getElementById('reduction-number').textContent = reductionResult;
      document.getElementById('reduction-title').textContent = reductionMeaning.title;
      document.getElementById('reduction-description').textContent = reductionMeaning.description;
      document.getElementById('reduction-mission').textContent = reductionMeaning.mission;

      // Update Addition Method
      document.getElementById('addition-number').textContent = additionResult;
      document.getElementById('addition-title').textContent = additionMeaning.title;
      document.getElementById('addition-description').textContent = additionMeaning.description;
      document.getElementById('addition-mission').textContent = additionMeaning.mission;

      // Show results
      document.getElementById('results').classList.add('active');

      // Handle note for different numbers
      const noteEl = document.getElementById('note');
      const noteTextEl = document.getElementById('note-text');

      if (reductionResult !== additionResult) {
        noteEl.classList.add('active');
        
        const hasMaster = isMasterNumber(reductionResult) || isMasterNumber(additionResult);
        
        if (hasMaster) {
          const masterNum = isMasterNumber(reductionResult) ? reductionResult : additionResult;
          const otherNum = isMasterNumber(reductionResult) ? additionResult : reductionResult;
          noteTextEl.innerHTML = `<strong>Note:</strong> When a Master Number (${masterNum}) appears, it becomes your primary Life Path, while the other number (${otherNum}) serves as secondary. Your path contains elements of both energies.`;
        } else {
          noteTextEl.innerHTML = `<strong>Note:</strong> The two methods produced different results. Most numerologists consider the Reduction Method to be the traditional approach.`;
        }
      } else {
        noteEl.classList.remove('active');
      }

      // Scroll to results
      document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
