function parseDate(str) {
  var parts = str.split('/');
  return new Date(parseInt(parts[2]), parseInt(parts[0]) - 1, parseInt(parts[1]));
}

function findSign(day, month, year) {
  var userDate = new Date(year, month - 1, day);
  for (var i = 0; i < zodiacRanges.length; i++) {
    var start = parseDate(zodiacRanges[i][0]);
    var end = parseDate(zodiacRanges[i][1]);
    if (userDate >= start && userDate <= end) {
      return { animal: zodiacRanges[i][2], element: zodiacRanges[i][3] };
    }
  }
  return null;
}

function fhCalculate() {
  var day = parseInt(document.getElementById('fhDay').value);
  var month = parseInt(document.getElementById('fhMonth').value);
  var year = parseInt(document.getElementById('fhYear').value);
  var errorEl = document.getElementById('fhError');

  errorEl.style.display = 'none';

  if (!day || !month || !year) {
    errorEl.textContent = 'Please fill in all fields.';
    errorEl.style.display = 'block';
    return;
  }

  if (year < 1900 || year > 2100) {
    errorEl.textContent = 'Please enter a year between 1900 and 2100.';
    errorEl.style.display = 'block';
    return;
  }

  var daysInMonth = new Date(year, month, 0).getDate();
  if (day < 1 || day > daysInMonth) {
    errorEl.textContent = 'Invalid day for the selected month.';
    errorEl.style.display = 'block';
    return;
  }

  var result = findSign(day, month, year);

  if (!result) {
    errorEl.textContent = 'Could not determine your sign. Please check your date.';
    errorEl.style.display = 'block';
    return;
  }

  var key = result.element + ' ' + result.animal;
  var data = forecasts[key];

  if (!data) {
    errorEl.textContent = 'Forecast not found for ' + key + '. Please try again.';
    errorEl.style.display = 'block';
    return;
  }

  document.getElementById('fhSymbol').textContent = animalSymbols[result.animal] || '';
  document.getElementById('fhTitle').textContent = key;
  document.getElementById('fhSubtitle').textContent = 'Your forecast for the Year of the Fire Horse 2026';
  document.getElementById('fhParagraph').textContent = data.p;

  var dosUl = document.getElementById('fhDos');
  var dontsUl = document.getElementById('fhDonts');
  dosUl.innerHTML = '';
  dontsUl.innerHTML = '';

  data.dos.forEach(function(item) {
    var li = document.createElement('li');
    li.textContent = item;
    dosUl.appendChild(li);
  });

  data.donts.forEach(function(item) {
    var li = document.createElement('li');
    li.textContent = item;
    dontsUl.appendChild(li);
  });
